<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UjianKu Lite - Mode Anti-Cheat</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    body.anti-cheat-active {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      margin-bottom: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: #e0e7ff;
      color: #1e40af;
    }

    .badge.danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    h1, h2, h3 {
      margin: 0 0 10px 0;
      line-height: 1.3;
    }

    p {
      margin: 0 0 12px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-sm {
      width: auto;
      padding: 7px 12px;
      font-size: 0.82rem;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .row-2 {
        grid-template-columns: 1fr;
      }
    }

    .exam-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
    }

    .exam-topbar-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .timer {
      color: var(--primary);
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .timer.low {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .progress-wrap {
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.2s ease;
    }

    .question-text {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.94rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .option-item:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .option-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
      font-weight: 600;
    }

    .option-item input[type="radio"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--primary);
    }

    .nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .q-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 6px;
      margin-top: 12px;
    }

    .q-num {
      padding: 6px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .q-num.answered {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
